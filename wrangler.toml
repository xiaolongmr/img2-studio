name = "img2-studio"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-05-23"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/version", "/healthz", "/api/*"]

[vars]
APP_VERSION = "cloudflare"
EXTERNAL_MODEL = "gpt-image-2"
EXTERNAL_4K_MODEL = "gpt-image-2"
INTERNAL_MODEL = "gpt-image-2"

[observability.logs]
enabled = true
